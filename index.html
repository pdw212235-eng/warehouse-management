<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자재 입출고 관리</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3347;
    --accent: #4f8cff;
    --accent2: #00e0a1;
    --danger: #ff5c5c;
    --warn: #ffb347;
    --text: #e8eaf0;
    --muted: #7b82a0;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans KR', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo-mark {
    width: 32px; height: 32px; background: var(--accent); border-radius: 6px;
    display: grid; place-items: center; font-family: var(--mono);
    font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header span { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .header-time { font-family: var(--mono); font-size: 12px; color: var(--accent2); }
  .sync-indicator {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); transition: background 0.3s;
  }
  .sync-indicator.syncing { background: var(--warn); animation: pulse 1s infinite; }
  .sync-indicator.ok      { background: var(--accent2); }
  .sync-indicator.error   { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav button {
    flex: 1; padding: 12px 8px; background: none; border: none;
    border-bottom: 2px solid transparent; color: var(--muted);
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { display: none; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
  .page.active { display: block; }

  /* Setup banner */
  .setup-banner {
    background: rgba(255,179,71,0.1); border: 1px solid var(--warn);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
    font-size: 13px; line-height: 1.6; display: none;
  }
  .setup-banner.visible { display: block; }
  .setup-banner strong { color: var(--warn); }

  .section-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 8px; margin-top: 20px;
  }
  .section-label:first-child { margin-top: 0; }

  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .type-btn {
    padding: 14px; border-radius: 10px; border: 2px solid var(--border);
    background: var(--surface); color: var(--muted);
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .type-btn.in.active  { border-color: var(--accent2); color: var(--accent2); background: rgba(0,224,161,0.08); }
  .type-btn.out.active { border-color: var(--danger);  color: var(--danger);  background: rgba(255,92,92,0.08); }

  .field { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: var(--muted); font-family: var(--mono); padding: 10px 14px 0; letter-spacing: 0.5px; }
  .field input, .field select { width: 100%; background: none; border: none; outline: none; color: var(--text); font-family: var(--sans); font-size: 15px; padding: 6px 14px 12px; }
  .field select option { background: var(--surface2); }

  /* Model row with scan button */
  .model-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 10px; }
  .model-row .field { flex: 1; margin-bottom: 0; }
  .scan-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-size: 20px; padding: 0 14px; cursor: pointer;
    transition: all 0.2s; flex-shrink: 0; display: flex; align-items: center;
  }
  .scan-btn:hover { border-color: var(--accent); color: var(--accent); }

  .qty-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .qty-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px 12px; }
  .qty-card-label { display: block; font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.5px; margin-bottom: 8px; }
  .current-num { font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--muted); }
  .current-num.ok  { color: var(--accent2); }
  .current-num.low { color: var(--danger); }
  .qty-controls { display: flex; align-items: center; gap: 6px; }
  .qty-controls button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 18px; cursor: pointer; display: grid; place-items: center; }
  #qty-input { width: 52px; text-align: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 18px; font-weight: 700; padding: 4px; }

  .submit-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn.in-mode  { background: var(--accent2); color: #0f1117; }
  .submit-btn.out-mode { background: var(--danger);  color: #fff; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .submit-btn:active:not(:disabled) { transform: scale(0.98); }

  /* Loading overlay */
  .loading-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,17,23,0.7); z-index: 200;
    place-items: center; backdrop-filter: blur(2px);
  }
  .loading-overlay.visible { display: grid; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 20px; font-size: 14px;
    font-weight: 500; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent2); color: var(--accent2); }
  .toast.error   { border-color: var(--danger);  color: var(--danger); }
  .toast.warn    { border-color: var(--warn);    color: var(--warn); }

  /* Chart */
  .chart-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 16px;
    height: 190px; position: relative;
  }
  .chart-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
  }
  .chart-canvas-wrap { height: 148px; position: relative; }

  /* Scan overlay */
  .scan-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,17,23,0.92); z-index: 300;
    place-items: center; backdrop-filter: blur(4px);
  }
  .scan-overlay.visible { display: grid; }
  .scan-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; width: min(400px, 90vw);
  }
  .scan-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600;
  }
  .scan-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .scan-close:hover { color: var(--text); }
  #scan-video { width: 100%; max-height: 280px; object-fit: cover; display: block; background: #000; }
  .scan-hint { padding: 12px 16px; font-size: 11px; color: var(--muted); font-family: var(--mono); text-align: center; }
  .scan-result-row { padding: 0 16px 14px; display: flex; gap: 8px; }
  #scan-manual { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 13px; padding: 8px 10px; outline: none; }
  #scan-manual:focus { border-color: var(--accent); }
  .scan-apply-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  /* Stock */
  .stock-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-chip { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; font-family: var(--mono); transition: all 0.15s; }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(79,140,255,0.1); }

  .refresh-btn { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; padding: 6px 10px; cursor: pointer; font-family: var(--mono); }
  .refresh-btn:hover { color: var(--accent); border-color: var(--accent); }

  .stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .stock-card.low { border-color: var(--danger); }
  .stock-cat { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; padding: 3px 7px; border-radius: 4px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
  .stock-info { flex: 1; min-width: 0; }
  .stock-model { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-qty { text-align: right; flex-shrink: 0; }
  .stock-qty .num { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .stock-qty .num.low { color: var(--danger); }
  .stock-qty .num.ok  { color: var(--accent2); }
  .stock-qty small { display: block; font-size: 10px; color: var(--muted); }

  /* History */
  .hist-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .hist-badge { padding: 3px 8px; border-radius: 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; white-space: nowrap; margin-top: 2px; }
  .hist-badge.in  { background: rgba(0,224,161,0.15); color: var(--accent2); }
  .hist-badge.out { background: rgba(255,92,92,0.15);  color: var(--danger); }
  .hist-info { flex: 1; }
  .hist-model { font-size: 14px; font-weight: 500; }
  .hist-meta  { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
  .hist-qty { font-family: var(--mono); font-size: 16px; font-weight: 700; }

  /* Settings */
  .settings-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .settings-row label { font-size: 14px; }
  .settings-row small { display: block; font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .settings-row input[type=text], .settings-row input[type=email], .settings-row input[type=number] { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 13px; padding: 6px 10px; }
  .save-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .gs-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .gs-box p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .gs-box code { display: block; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--accent2); word-break: break-all; background: var(--bg); padding: 10px; border-radius: 6px; }

  /* MinStock grid */
  .minstock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .minstock-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 12px; }
  .minstock-item label { display: block; font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.5px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .minstock-item input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 16px; font-weight: 700; padding: 6px 10px; text-align: center; outline: none; }
  .minstock-item input:focus { border-color: var(--accent); }
  .minstock-empty { font-size: 13px; color: var(--muted); font-family: var(--mono); padding: 10px 0; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

  .last-sync { font-size: 11px; color: var(--muted); font-family: var(--mono); text-align: right; margin-bottom: 8px; }

  /* Stock card — clickable */
  .stock-card { cursor: pointer; }
  .stock-card:hover { border-color: var(--accent); background: rgba(79,140,255,0.05); }
  .stock-card.low:hover { border-color: var(--danger); background: rgba(255,92,92,0.05); }
  .stock-last { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 3px; }
  .stock-chevron { color: var(--muted); font-size: 18px; margin-left: 4px; flex-shrink: 0; }

  /* Detail drawer */
  .detail-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,17,23,0.65); z-index: 400;
  }
  .detail-overlay.visible { display: block; }
  .detail-drawer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 401;
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    max-height: 85vh; overflow-y: auto;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(.32,.72,0,1);
    padding: 0 20px 36px;
  }
  .detail-drawer.visible { transform: translateY(0); }
  .detail-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 12px auto 0;
  }
  .detail-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 0 14px; border-bottom: 1px solid var(--border);
  }
  .detail-title { font-size: 18px; font-weight: 700; }
  .detail-cat { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 4px; }
  .detail-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
  .detail-close:hover { color: var(--text); }
  .detail-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 14px 0 4px;
  }
  .detail-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 8px; text-align: center; }
  .detail-stat .stat-val { font-family: var(--mono); font-size: 22px; font-weight: 700; }
  .detail-stat .stat-val.ok  { color: var(--accent2); }
  .detail-stat .stat-val.low { color: var(--danger); }
  .detail-stat .stat-val.in  { color: var(--accent2); }
  .detail-stat .stat-val.out { color: var(--danger); }
  .detail-stat .stat-lbl { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 4px; }
  .detail-filter { display: flex; gap: 8px; padding: 12px 0 4px; }
  .detail-action {
    display: flex; gap: 8px; padding: 4px 0 12px; border-bottom: 1px solid var(--border);
  }
  .detail-action-btn {
    flex: 1; padding: 10px; border-radius: 8px; border: none;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .detail-action-btn.in  { background: rgba(0,224,161,0.12); color: var(--accent2); border: 1px solid rgba(0,224,161,0.3); }
  .detail-action-btn.out { background: rgba(255,92,92,0.12);  color: var(--danger);  border: 1px solid rgba(255,92,92,0.3); }
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
</div>

<!-- 스캔 오버레이 -->
<div class="scan-overlay" id="scan-overlay">
  <div class="scan-box">
    <div class="scan-header">
      <span>📷 QR / 바코드 스캔</span>
      <button class="scan-close" onclick="closeScan()">✕</button>
    </div>
    <video id="scan-video" autoplay playsinline muted></video>
    <canvas id="scan-canvas" style="display:none"></canvas>
    <div class="scan-hint">카메라를 QR코드에 가져다 대세요 · 인식 시 자동 적용</div>
    <div class="scan-result-row">
      <input type="text" id="scan-manual" placeholder="직접 입력 후 적용">
      <button class="scan-apply-btn" onclick="applyScannedCode(document.getElementById('scan-manual').value)">적용</button>
    </div>
  </div>
</div>

<!-- 상세 드로어 -->
<div class="detail-overlay" id="detail-overlay" onclick="closeItemDetail()"></div>
<div class="detail-drawer" id="detail-drawer">
  <div class="detail-handle"></div>
  <div class="detail-header">
    <div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-cat" id="detail-cat"></div>
    </div>
    <button class="detail-close" onclick="closeItemDetail()">✕</button>
  </div>
  <div class="detail-stats" id="detail-stats"></div>
  <div class="detail-action">
    <button class="detail-action-btn in" onclick="goRecord('in')">▲ 입고 등록</button>
    <button class="detail-action-btn out" onclick="goRecord('out')">▼ 출고 등록</button>
  </div>
  <div class="detail-filter">
    <button class="filter-chip active" onclick="filterItemHistory('ALL', this)">전체</button>
    <button class="filter-chip" onclick="filterItemHistory('in', this)">▲ 입고</button>
    <button class="filter-chip" onclick="filterItemHistory('out', this)">▼ 출고</button>
  </div>
  <div id="detail-history-list"></div>
  <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
    <button id="hide-toggle-btn" onclick="toggleHideItem()" style="width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:var(--sans);font-size:13px;cursor:pointer;">⊖ 이 항목 숨기기</button>
  </div>
</div>

<header>
  <div class="logo-mark">WH</div>
  <div>
    <h1>자재 입출고 관리</h1>
    <span>WAREHOUSE SYSTEM v2.3 · 2026-05-19</span>
  </div>
  <div class="header-right">
    <div class="sync-indicator" id="sync-dot" title="연결 상태"></div>
    <div class="header-time" id="clock">--:--:--</div>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('record', this)">📦 입출고</button>
  <button onclick="switchTab('stock', this)">📊 재고현황</button>
  <button onclick="switchTab('settings', this)">⚙️ 설정</button>
</nav>

<!-- ══ 입출고 ══ -->
<div class="page active" id="page-record">
  <div class="section-label">입고 / 출고 선택</div>
  <div class="type-toggle">
    <button class="type-btn in active" onclick="setType('in')">▲ 입고</button>
    <button class="type-btn out" onclick="setType('out')">▼ 출고</button>
  </div>

  <div class="section-label">담당자</div>
  <div class="field">
    <label>OPERATOR</label>
    <select id="operator"><option value="">-- 선택 --</option></select>
  </div>

  <div class="section-label">카테고리 & 모델</div>
  <div class="field">
    <label>CATEGORY</label>
    <select id="category" onchange="resetSerial(); updateModels()">
      <option value="">-- 선택 --</option>
      <option value="MCU">MCU</option>
      <option value="MINI_PC">MINI PC</option>
      <option value="SMPS">SMPS</option>
      <option value="PCB">PCB & 전자부품</option>
      <option value="HARNESS">케이블</option>
    </select>
  </div>
  <div class="model-row">
    <div class="field">
      <label>MODEL</label>
      <select id="model" onchange="resetSerial(); updateCurrentStock();"><option value="">-- 카테고리 먼저 선택 --</option></select>
    </div>
    <button class="scan-btn" onclick="startScan()" title="QR/바코드 스캔">📷</button>
  </div>
  <div id="serial-row" style="display:none;margin-bottom:10px">
    <div class="field">
      <label>SERIAL (QR)</label>
      <div id="serial-display" style="padding:6px 14px 12px;font-family:var(--mono);font-size:13px;color:var(--accent2);display:flex;align-items:center;gap:8px">
        <span id="serial-value"></span>
        <button onclick="resetSerial()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0">✕ 초기화</button>
      </div>
    </div>
  </div>

  <div class="section-label">수량</div>
  <div class="qty-row">
    <div class="qty-card">
      <span class="qty-card-label">CURRENT STOCK</span>
      <div class="current-num" id="current-stock">—</div>
    </div>
    <div class="qty-card">
      <span class="qty-card-label">입출고 수량</span>
      <div class="qty-controls">
        <button onclick="changeQty(-1)">−</button>
        <input type="number" id="qty-input" value="1" min="1" oninput="sanitizeQty(this)">
        <button onclick="changeQty(1)">＋</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label>MEMO (선택)</label>
    <input type="text" id="memo" placeholder="비고사항 입력" style="padding:8px 14px 12px">
  </div>

  <button class="submit-btn in-mode" id="submit-btn" onclick="submitRecord()">▲ 입고 기록</button>
</div>

<!-- ══ 재고현황 ══ -->
<div class="page" id="page-stock">
  <!-- 차트 -->
  <div class="chart-wrap">
    <div class="chart-title">STOCK OVERVIEW</div>
    <div class="chart-canvas-wrap">
      <canvas id="stock-chart"></canvas>
    </div>
  </div>

  <div style="display:flex;align-items:center;margin-bottom:12px">
    <div class="stock-filter" id="stock-filter" style="margin-bottom:0;flex:1">
      <button class="filter-chip active" onclick="filterStock('ALL', this)">전체</button>
      <button class="filter-chip" onclick="filterStock('MCU', this)">MCU</button>
      <button class="filter-chip" onclick="filterStock('MINI_PC', this)">MINI PC</button>
      <button class="filter-chip" onclick="filterStock('SMPS', this)">SMPS</button>
      <button class="filter-chip" onclick="filterStock('PCB', this)">PCB</button>
      <button class="filter-chip" onclick="filterStock('HARNESS', this)">케이블</button>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
  </div>
  <div class="last-sync" id="last-sync-text"></div>
  <div id="stock-list"></div>
</div>

<!-- ══ 설정 ══ -->
<div class="page" id="page-settings">
  <div class="section-label">담당자 관리</div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>담당자 목록 <small style="display:inline;font-family:var(--mono);color:var(--muted)">(쉼표로 구분)</small></label>
    <input type="text" id="operators-input" placeholder="홍길동, 김철수, 이영희" style="width:100%;text-align:left">
  </div>

  <div class="section-label">모델 관리</div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>MCU 모델</label>
    <input type="text" id="mcu-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>MINI PC 모델</label>
    <input type="text" id="minipc-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>SMPS 모델</label>
    <input type="text" id="smps-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>PCB & 전자부품</label>
    <input type="text" id="pcb-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>케이블</label>
    <input type="text" id="harness-models" style="width:100%;text-align:left">
  </div>

  <div class="section-label">최소 재고 설정</div>
  <div id="minstock-container">
    <p class="minstock-empty">모델을 먼저 등록하고 설정을 저장하면 입력 필드가 나타납니다.</p>
  </div>

  <button class="save-btn" onclick="saveSettings()">💾 설정 저장 (Sheets에 동기화)</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── 상태 ───────────────────────────────────────────────
const GS_URL    = 'https://script.google.com/macros/s/AKfycbzTbofbljbiXTIDM3cdnpPydGYjR-pw-W3dsDlYDisyIAKntTBNhwULZUZ4X4zuuySu0Q/exec';
const GS_TOKEN  = 'TEAM_SECRET_2024';
const ADMIN_PIN = '5552';
let settings  = null;
let records   = [];
let stockData = [];
let currentType        = 'in';
let currentStockFilter = 'ALL';
let lastSyncTime = null;
let stockChart = null;
let currentSerial = null;
let detailItem = null;
let detailTypeFilter = 'ALL';
let hiddenItems = new Set(JSON.parse(localStorage.getItem('hiddenItems') || '[]'));
let showHidden = false;

// ─── 초기화 ─────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  renderClock();
  setInterval(renderClock, 1000);
  await loadData();
  setInterval(loadData, 5 * 60 * 1000);
});

// ─── 데이터 로드 (Sheets) ────────────────────────────────
async function loadData() {
  if (!GS_URL) return;
  setSyncStatus('syncing');
  try {
    const res  = await fetch(GS_URL + '?action=all&token=' + GS_TOKEN, { cache: 'no-cache' });
    const data = await res.json();

    if (data.status !== 'ok') throw new Error(data.msg || 'API 오류');

    settings  = data.settings  || getDefaultSettings();
    records   = (data.records || []).map(normalizeRecord);
    stockData = data.stock     || [];

    lastSyncTime = new Date();
    setSyncStatus('ok');

    loadSettingsUI(settings);
    renderStock();
    updateCurrentStock();
    if (detailItem) renderItemHistory();

  } catch(e) {
    setSyncStatus('error');
    showToast('데이터 로드 실패: ' + e.message, 'error');
    if (!settings) { settings = getDefaultSettings(); loadSettingsUI(settings); }
  }
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-indicator ' + state;
}

// ─── 설정 UI 반영 ────────────────────────────────────────
function loadSettingsUI(s) {
  document.getElementById('operators-input').value = (s.operators||[]).join(', ');
  document.getElementById('mcu-models').value      = (s.models?.MCU||[]).join(', ');
  document.getElementById('minipc-models').value   = (s.models?.MINI_PC||[]).join(', ');
  document.getElementById('smps-models').value     = (s.models?.SMPS||[]).join(', ');
  document.getElementById('pcb-models').value      = (s.models?.PCB||[]).join(', ');
  document.getElementById('harness-models').value  = (s.models?.HARNESS||[]).join(', ');
  populateOperators(s.operators || []);
  renderMinStockSettings(s);
}

function populateOperators(ops) {
  const sel = document.getElementById('operator');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 선택 --</option>';
  ops.forEach(o => sel.innerHTML += `<option value="${o}">${o}</option>`);
  if (cur) sel.value = cur;
}

// ─── 최소 재고 UI ────────────────────────────────────────
function renderMinStockSettings(s) {
  const container = document.getElementById('minstock-container');
  const models    = s.models   || {};
  const minStock  = s.minStock || {};
  const cats = ['MCU', 'MINI_PC', 'SMPS', 'PCB', 'HARNESS'];
  const catLabel = {MCU:'MCU', MINI_PC:'MINI PC', SMPS:'SMPS', PCB:'PCB & 전자부품', HARNESS:'케이블'};

  let html = '';
  cats.forEach(cat => {
    const mList = models[cat] || [];
    if (!mList.length) return;
    html += `<div style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin:14px 0 8px">${catLabel[cat]}</div>`;
    html += '<div class="minstock-grid">';
    mList.forEach(m => {
      const val = minStock[m] !== undefined ? minStock[m] : '';
      html += `<div class="minstock-item">
        <label title="${m}">${m}</label>
        <input type="number" class="minstock-input" data-model="${escapeAttr(m)}" value="${val}" min="0" placeholder="0">
      </div>`;
    });
    html += '</div>';
  });

  container.innerHTML = html || '<p class="minstock-empty">모델을 먼저 등록하고 설정을 저장하면 입력 필드가 나타납니다.</p>';
}

function escapeAttr(str) {
  return String(str ?? '').replace(/"/g, '&quot;');
}

// ─── 설정 저장 (Sheets) ──────────────────────────────────
async function saveSettings() {
  const minStock = {};
  document.querySelectorAll('.minstock-input').forEach(inp => {
    const val = parseInt(inp.value);
    if (!isNaN(val) && val >= 0) minStock[inp.dataset.model] = val;
  });

  const newSettings = {
    operators: splitCSV('operators-input'),
    models: {
      MCU:     splitCSV('mcu-models'),
      MINI_PC: splitCSV('minipc-models'),
      SMPS:    splitCSV('smps-models'),
      PCB:     splitCSV('pcb-models'),
      HARNESS: splitCSV('harness-models'),
    },
    minStock
  };
  setLoading(true);
  try {
    await fetchPost({ action: 'saveSettings', settings: newSettings });
    settings = newSettings;
    loadSettingsUI(settings);
    showToast('설정이 Sheets에 저장되었습니다', 'success');
    setSyncStatus('ok');
  } catch(e) {
    showToast('저장 실패: ' + e.message, 'error');
  } finally {
    setLoading(false);
  }
}

function splitCSV(id) {
  return document.getElementById(id).value.split(',').map(s=>s.trim()).filter(Boolean);
}

// ─── 레코드 정규화 (시트 직접 입력 호환) ─────────────────
function normalizeRecord(r) {
  return { ...r, type: normalizeType(r.type), ts: normalizeTs(r.ts) };
}
function normalizeType(t) {
  if (!t) return 'in';
  if (t === '입고') return 'in';
  if (t === '출고') return 'out';
  return String(t).toLowerCase();
}
function normalizeTs(ts) {
  if (!ts) return new Date().toISOString();
  const s = String(ts).trim();
  // "2026-04-08 11:23:30" → KST로 처리 (T 삽입 + +09:00)
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(s)) return s.replace(' ', 'T') + '+09:00';
  return s;
}

// ─── 입출고 타입 ─────────────────────────────────────────
function setType(t) {
  currentType = t;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.type-btn.' + t).classList.add('active');
  const btn = document.getElementById('submit-btn');
  btn.className = 'submit-btn ' + (t==='in' ? 'in-mode' : 'out-mode');
  btn.textContent = t==='in' ? '▲ 입고 기록' : '▼ 출고 기록';
}

// ─── 모델 업데이트 ───────────────────────────────────────
function updateModels() {
  const cat     = document.getElementById('category').value;
  const modelSel= document.getElementById('model');
  const models  = settings?.models || getDefaultSettings().models;

  modelSel.innerHTML = '<option value="">-- 선택 --</option>';
  if (cat && models[cat]) {
    models[cat].forEach(m => modelSel.innerHTML += `<option value="${m}">${m}</option>`);
  }
  updateCurrentStock();
}

// ─── 현재 재고 표시 ──────────────────────────────────────
function updateCurrentStock() {
  const category = document.getElementById('category').value;
  const model    = document.getElementById('model').value;
  const el       = document.getElementById('current-stock');

  if (!category || !model) {
    el.textContent = '—';
    el.className = 'current-num';
    updateSerialUI();
    return;
  }

  const found = stockData.find(s => s.category === category && s.model === model);
  if (!found) {
    el.textContent = '0';
    el.className = 'current-num ok';
  } else {
    const isLow = found.minQty > 0 && found.qty <= found.minQty;
    el.textContent = found.qty;
    el.className = 'current-num ' + (isLow ? 'low' : 'ok');
  }
  updateSerialUI();
}

function resetSerial() {
  currentSerial = null;
  updateSerialUI();
}

function updateSerialUI() {
  const cat = document.getElementById('category').value;
  const isSerialCat = cat === 'MCU' || cat === 'MINI_PC';
  const serialRow = document.getElementById('serial-row');
  const qtyInput  = document.getElementById('qty-input');
  const qtyBtns   = document.querySelectorAll('.qty-controls button');

  if (currentSerial && isSerialCat) {
    serialRow.style.display = 'block';
    document.getElementById('serial-value').textContent = currentSerial;
    qtyInput.value = 1;
    qtyInput.disabled = true;
    qtyBtns.forEach(b => b.disabled = true);
  } else {
    serialRow.style.display = 'none';
    qtyInput.disabled = false;
    qtyBtns.forEach(b => b.disabled = false);
  }
}

// ─── 수량 ───────────────────────────────────────────────
function changeQty(d) {
  if (currentSerial) return;
  const inp=document.getElementById('qty-input');
  inp.value=Math.max(1,parseInt(inp.value||1)+d);
}
function sanitizeQty(inp) {
  const v = parseInt(inp.value);
  inp.value = isNaN(v) || v < 1 ? 1 : v;
}

// ─── 기록 제출 ───────────────────────────────────────────
async function submitRecord() {
  const operator = document.getElementById('operator').value;
  const category = document.getElementById('category').value;
  const model    = document.getElementById('model').value;
  const qty      = parseInt(document.getElementById('qty-input').value);
  const memo     = document.getElementById('memo').value.trim();

  if (!operator) { showToast('담당자를 선택하세요', 'error'); return; }
  if (!category) { showToast('카테고리를 선택하세요', 'error'); return; }
  if (!model)    { showToast('모델을 선택하세요', 'error'); return; }
  if (!qty||qty<1) { showToast('수량을 확인하세요', 'error'); return; }

  const serial = currentSerial || '';
  const record = {
    id: Date.now(), ts: new Date().toISOString(),
    type: currentType, operator, category, model, qty, memo, serial
  };

  setLoading(true);
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;

  try {
    await fetchPost(record);
    const label = (currentType==='in'?'▲ 입고':'▼ 출고')+' 기록 완료';
    showToast(serial ? label + ' · ' + serial : label + ' ('+qty+'개)', 'success');
    document.getElementById('qty-input').value = 1;
    document.getElementById('memo').value = '';
    const wasSerial = !!serial;
    currentSerial = null;
    await loadData();
    if (wasSerial) {
      setTimeout(() => startScan(), 600);
    }
  } catch(e) {
    showToast('기록 실패: ' + e.message, 'error');
  } finally {
    setLoading(false);
    btn.disabled = false;
  }
}

// ─── fetch POST ──────────────────────────────────────────
async function fetchPost(body) {
  const res = await fetch(GS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ ...body, token: GS_TOKEN })
  });
  try {
    const data = await res.json();
    if (data.status === 'error') throw new Error(data.msg);
    return data;
  } catch(e) {
    return { status: 'ok' };
  }
}

// ─── 재고 차트 ───────────────────────────────────────────
const CAT_COLORS = {
  MCU: '#4f8cff', MINI_PC: '#00e0a1', SMPS: '#ffb347', PCB: '#a78bfa', HARNESS: '#fb923c'
};
const CAT_LABEL = {MCU:'MCU', MINI_PC:'MINI PC', SMPS:'SMPS', PCB:'PCB', HARNESS:'케이블'};

function buildChartData() {
  if (currentStockFilter === 'ALL') {
    const cats = ['MCU', 'MINI_PC', 'SMPS', 'PCB', 'HARNESS'];
    return {
      labels: cats.map(c => CAT_LABEL[c]),
      values: cats.map(c => stockData.filter(s => s.category === c).reduce((sum, s) => sum + (s.qty || 0), 0)),
      colors: cats.map(c => CAT_COLORS[c]),
    };
  }
  const data = stockData.filter(s => s.category === currentStockFilter);
  return {
    labels: data.map(s => s.model),
    values: data.map(s => s.qty || 0),
    colors: data.map(s => (s.minQty > 0 && s.qty <= s.minQty) ? '#ff5c5c' : CAT_COLORS[currentStockFilter] || '#4f8cff'),
  };
}

function renderChart() {
  const canvas = document.getElementById('stock-chart');
  if (!canvas) return;

  const { labels, values, colors } = buildChartData();
  const chartOpts = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#1a1d27',
        borderColor: '#2e3347',
        borderWidth: 1,
        titleColor: '#e8eaf0',
        bodyColor: '#7b82a0',
        callbacks: { label: ctx => ' ' + ctx.parsed.y + ' 개' }
      }
    },
    scales: {
      x: {
        grid: { color: '#2e3347' },
        ticks: { color: '#7b82a0', font: { family: 'IBM Plex Mono', size: 10 } }
      },
      y: {
        grid: { color: '#2e3347' },
        ticks: { color: '#7b82a0', font: { family: 'IBM Plex Mono', size: 10 }, precision: 0 },
        beginAtZero: true
      }
    }
  };

  if (stockChart) {
    stockChart.data.labels = labels;
    stockChart.data.datasets[0].data = values;
    stockChart.data.datasets[0].backgroundColor = colors;
    stockChart.update('none');
  } else {
    stockChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: values,
          backgroundColor: colors,
          borderRadius: 4,
          borderSkipped: false,
        }]
      },
      options: chartOpts
    });
  }
}

// ─── 재고현황 ────────────────────────────────────────────
function filterStock(cat, el) {
  currentStockFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderStock();
}

function renderStock() {
  const list   = document.getElementById('stock-list');
  const syncEl = document.getElementById('last-sync-text');
  if (lastSyncTime) syncEl.textContent = '최근 동기화: ' + lastSyncTime.toLocaleTimeString('ko-KR');

  renderChart();

  let data = stockData;
  if (currentStockFilter !== 'ALL') data = data.filter(s=>s.category===currentStockFilter);

  const hiddenInView = data.filter(s => hiddenItems.has(s.category+':'+s.model));
  if (!showHidden) data = data.filter(s => !hiddenItems.has(s.category+':'+s.model));

  if (!data.length && !hiddenInView.length) {
    list.innerHTML='<div class="empty-state"><div class="icon">📦</div>기록된 재고가 없습니다</div>';
    return;
  }
  list.innerHTML = data.map(s => {
    const isLow = s.minQty > 0 && s.qty <= s.minQty;
    const lastRec = records
      .filter(r => r.category === s.category && r.model === s.model)
      .sort((a, b) => new Date(b.ts) - new Date(a.ts))[0];
    const lastStr = lastRec
      ? new Date(lastRec.ts).toLocaleDateString('ko-KR', {month:'2-digit', day:'2-digit'})
        + ' ' + (lastRec.type === 'in' ? '▲' : '▼')
      : null;
    return `<div class="stock-card ${isLow?'low':''}" onclick="openItemDetail('${escapeAttr(s.category)}','${escapeAttr(s.model)}')">
      <span class="stock-cat">${CAT_LABEL[s.category]||s.category}</span>
      <div class="stock-info">
        <div class="stock-model">${s.model}</div>
        ${lastStr ? `<div class="stock-last">${lastStr}</div>` : ''}
      </div>
      <div class="stock-qty">
        <div class="num ${isLow?'low':'ok'}">${s.qty}</div>
        <small>${isLow?'⚠ 부족':'정상'}</small>
      </div>
      <span class="stock-chevron">›</span>
    </div>`;
  }).join('');

  // 숨긴 항목 토글
  if (hiddenInView.length) {
    list.innerHTML += `<button onclick="toggleShowHidden()" style="width:100%;margin-top:10px;padding:11px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;">
      ${showHidden ? '▲ 숨긴 항목 접기' : `⊙ 숨긴 항목 ${hiddenInView.length}개 보기`}
    </button>`;
    if (showHidden) {
      list.innerHTML += hiddenInView.map(s => {
        const lastRec = records.filter(r => r.category===s.category && r.model===s.model).sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0];
        const lastStr = lastRec ? new Date(lastRec.ts).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'})+' '+(lastRec.type==='in'?'▲':'▼') : null;
        return `<div class="stock-card" onclick="openItemDetail('${escapeAttr(s.category)}','${escapeAttr(s.model)}')" style="opacity:0.45;border-style:dashed">
          <span class="stock-cat">${CAT_LABEL[s.category]||s.category}</span>
          <div class="stock-info">
            <div class="stock-model">${s.model}</div>
            ${lastStr?`<div class="stock-last">${lastStr}</div>`:''}
          </div>
          <div class="stock-qty">
            <div class="num ok">${s.qty}</div>
            <small>숨김</small>
          </div>
          <span class="stock-chevron">›</span>
        </div>`;
      }).join('');
    }
  }
}

function toggleShowHidden() {
  showHidden = !showHidden;
  renderStock();
}

// ─── 아이템 상세 드로어 ──────────────────────────────────
function openItemDetail(category, model) {
  detailItem = { category, model };
  detailTypeFilter = 'ALL';

  document.getElementById('detail-title').textContent = model;
  document.getElementById('detail-cat').textContent = (CAT_LABEL[category] || category).toUpperCase();

  const found = stockData.find(s => s.category === category && s.model === model);
  const currentQty = found ? (found.qty || 0) : 0;
  const isLow = found && found.minQty > 0 && currentQty <= found.minQty;
  const itemRecs = records.filter(r => r.category === category && r.model === model);
  const totalIn  = itemRecs.filter(r => r.type === 'in').reduce((s, r) => s + (r.qty || 0), 0);
  const totalOut = itemRecs.filter(r => r.type === 'out').reduce((s, r) => s + (r.qty || 0), 0);

  document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat">
      <div class="stat-val ${isLow ? 'low' : 'ok'}">${currentQty}</div>
      <div class="stat-lbl">현재고</div>
    </div>
    <div class="detail-stat">
      <div class="stat-val in">${totalIn}</div>
      <div class="stat-lbl">총 입고</div>
    </div>
    <div class="detail-stat">
      <div class="stat-val out">${totalOut}</div>
      <div class="stat-lbl">총 출고</div>
    </div>`;

  document.querySelectorAll('.detail-filter .filter-chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.detail-filter .filter-chip').classList.add('active');

  renderItemHistory();

  const key = category + ':' + model;
  const isHidden = hiddenItems.has(key);
  const hideBtn = document.getElementById('hide-toggle-btn');
  hideBtn.textContent = isHidden ? '⊕ 숨김 해제' : '⊖ 이 항목 숨기기';
  hideBtn.style.color = isHidden ? 'var(--accent2)' : 'var(--muted)';
  hideBtn.style.borderColor = isHidden ? 'rgba(0,224,161,0.3)' : 'var(--border)';

  document.getElementById('detail-overlay').classList.add('visible');
  document.getElementById('detail-drawer').classList.add('visible');
}

function toggleHideItem() {
  if (!detailItem) return;
  const key = detailItem.category + ':' + detailItem.model;
  if (hiddenItems.has(key)) {
    hiddenItems.delete(key);
  } else {
    hiddenItems.add(key);
  }
  localStorage.setItem('hiddenItems', JSON.stringify([...hiddenItems]));
  renderStock();
  closeItemDetail();
  showToast(hiddenItems.has(key) ? '항목이 숨겨졌습니다' : '숨김이 해제되었습니다', 'success');
}

function closeItemDetail() {
  document.getElementById('detail-overlay').classList.remove('visible');
  document.getElementById('detail-drawer').classList.remove('visible');
  detailItem = null;
}

function filterItemHistory(type, el) {
  detailTypeFilter = type;
  document.querySelectorAll('.detail-filter .filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderItemHistory();
}

function renderItemHistory() {
  if (!detailItem) return;
  const list = document.getElementById('detail-history-list');
  let data = records.filter(r => r.category === detailItem.category && r.model === detailItem.model);
  if (detailTypeFilter !== 'ALL') data = data.filter(r => r.type === detailTypeFilter);

  if (!data.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div>기록이 없습니다</div>';
    return;
  }
  list.innerHTML = data.map(r => {
    const d = new Date(r.ts);
    const dateStr = d.toLocaleDateString('ko-KR') + ' ' + d.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    return `<div class="hist-item">
      <span class="hist-badge ${r.type}">${r.type === 'in' ? '▲ 입고' : '▼ 출고'}</span>
      <div class="hist-info">
        <div class="hist-meta">${r.operator || '—'}</div>
        <div class="hist-meta">${dateStr}${r.memo ? ' · ' + r.memo : ''}${r.serial ? ' · SN:' + r.serial : ''}</div>
      </div>
      <div class="hist-qty">${r.qty ?? '—'}개</div>
    </div>`;
  }).join('');
}

function goRecord(type) {
  if (!detailItem) return;
  closeItemDetail();
  setType(type);
  const catSel = document.getElementById('category');
  catSel.value = detailItem.category;
  updateModels();
  document.getElementById('model').value = detailItem.model;
  updateCurrentStock();
  const navBtn = document.querySelector('nav button');
  switchTab('record', navBtn);
}

// ─── Data Matrix / QR 스캔 (zxing-wasm) ─────────────────
let scanStream  = null;
let scanTimer   = null;
let zxingRead   = null;
let isDecoding  = false;

async function loadZxingWasm() {
  if (zxingRead) return zxingRead;
  const { readBarcodesFromImageData } = await import(
    'https://esm.sh/zxing-wasm@2/reader'
  );
  zxingRead = readBarcodesFromImageData;
  return zxingRead;
}

async function startScan() {
  document.getElementById('scan-manual').value = '';
  document.getElementById('scan-overlay').classList.add('visible');

  try {
    const readBarcodes = await loadZxingWasm();

    const allDevices  = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = allDevices.filter(d => d.kind === 'videoinput');
    const back = videoDevices.find(d => /back|rear|후면/i.test(d.label));
    const deviceId = (back || videoDevices[videoDevices.length - 1])?.deviceId;

    scanStream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'environment' }
    });

    const video = document.getElementById('scan-video');
    video.srcObject = scanStream;
    await video.play();

    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d', { willReadFrequently: true });

    scanTimer = setInterval(async () => {
      if (isDecoding || !scanStream) return;
      if (video.readyState < video.HAVE_ENOUGH_DATA) return;

      isDecoding = true;
      try {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const results   = await readBarcodes(imageData, {
          formats:   ['DataMatrix', 'QRCode'],
          tryHarder: true,
        });
        if (results.length > 0) {
          const code = results[0].text.trim();
          closeScan();
          applyScannedCode(code);
        }
      } finally {
        isDecoding = false;
      }
    }, 150);

  } catch(e) {
    showToast('카메라 접근 실패: ' + (e.message || e), 'error');
    closeScan();
  }
}

function closeScan() {
  document.getElementById('scan-overlay').classList.remove('visible');
  if (scanTimer)  { clearInterval(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  isDecoding = false;
}

function applyScannedCode(code) {
  if (!code) return;
  const models = settings?.models || {};

  // QR 형식: {모델명}{YYMMDDNNNN} — 마지막 10자리가 숫자면 날짜+순번
  let modelCode = code;
  let serial = null;
  if (code.length > 10 && /^\d{10}$/.test(code.slice(-10))) {
    modelCode = code.slice(0, -10);
    serial = code;
  }

  for (const [cat, mList] of Object.entries(models)) {
    const match = mList.find(m => m === modelCode || m.toLowerCase() === modelCode.toLowerCase());
    if (match) {
      document.getElementById('category').value = cat;
      updateModels();
      document.getElementById('model').value = match;
      currentSerial = serial;
      updateCurrentStock();
      const msg = serial ? `모델: ${match} · SN: ${serial}` : `모델 인식: ${match}`;
      showToast(msg, 'success');
      switchTab('record', document.querySelector('nav button'));
      return;
    }
  }
  showToast('일치하는 모델 없음 — 직접 선택하세요: ' + code, 'warn');
}

// ─── 탭 전환 ─────────────────────────────────────────────
function switchTab(name, btn) {
  if (name === 'settings') {
    const pin = prompt('관리자 PIN을 입력하세요');
    if (pin === null) return;
    if (pin !== ADMIN_PIN) { showToast('PIN이 올바르지 않습니다', 'error'); return; }
  }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if (name === 'stock') renderChart();
}

// ─── 유틸 ────────────────────────────────────────────────
function renderClock() {
  document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function setLoading(v) {
  document.getElementById('loading-overlay').classList.toggle('visible', v);
}
function showToast(msg,type='success') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function getDefaultSettings() {
  return {
    operators:['창고지기'],
    models:{MCU:['STM32F4','ATmega328','ESP32'],MINI_PC:['Raspberry Pi 4','Jetson Nano'],SMPS:['24V 5A','12V 10A'],PCB:['메인보드 Rev1','센서보드 Rev2'],HARNESS:['전원 하네스 A','CAN 케이블']},
    minStock:{}
  };
}
