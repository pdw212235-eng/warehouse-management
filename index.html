<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자재 입출고 관리</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loading-overlay" id="loading-overlay">
  <div class="spinner"></div>
</div>

<!-- 스캔 오버레이 -->
<div class="scan-overlay" id="scan-overlay">
  <div class="scan-box">
    <div class="scan-header">
      <span>📷 QR / 바코드 스캔</span>
      <button class="scan-close" onclick="closeScan()">✕</button>
    </div>
    <video id="scan-video" autoplay playsinline muted></video>
    <canvas id="scan-canvas" style="display:none"></canvas>
    <div class="scan-hint">카메라를 QR코드에 가져다 대세요 · 인식 시 자동 적용</div>
    <div class="scan-result-row">
      <input type="text" id="scan-manual" placeholder="직접 입력 후 적용">
      <button class="scan-apply-btn" onclick="applyScannedCode(document.getElementById('scan-manual').value)">적용</button>
    </div>
  </div>
</div>

<!-- 상세 드로어 -->
<div class="detail-overlay" id="detail-overlay" onclick="closeItemDetail()"></div>
<div class="detail-drawer" id="detail-drawer">
  <div class="detail-handle"></div>
  <div class="detail-header">
    <div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-cat" id="detail-cat"></div>
    </div>
    <button class="detail-close" onclick="closeItemDetail()">✕</button>
  </div>
  <div class="detail-note-wrap">
    <textarea id="detail-note" class="detail-note" rows="2"
      placeholder="메모, 설명 · 누구나 수정 가능"
      oninput="onNoteInput()" onblur="saveItemNote()"></textarea>
    <div class="detail-note-status" id="detail-note-status"></div>
  </div>
  <div class="detail-stats" id="detail-stats"></div>
  <div class="detail-action">
    <button class="detail-action-btn in" onclick="goRecord('in')">▲ 입고 등록</button>
    <button class="detail-action-btn out" onclick="goRecord('out')">▼ 출고 등록</button>
  </div>
  <div class="detail-filter">
    <button class="filter-chip active" onclick="filterItemHistory('ALL', this)">전체</button>
    <button class="filter-chip" onclick="filterItemHistory('in', this)">▲ 입고</button>
    <button class="filter-chip" onclick="filterItemHistory('out', this)">▼ 출고</button>
  </div>
  <div id="detail-history-list"></div>
  <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
    <button id="hide-toggle-btn" onclick="toggleHideItem()" style="width:100%;padding:11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:var(--sans);font-size:13px;cursor:pointer;">⊖ 이 항목 숨기기</button>
  </div>
</div>

<header>
  <div class="logo-mark">WH</div>
  <div>
    <h1>자재 입출고 관리</h1>
    <span>WAREHOUSE SYSTEM v2.4 · 2026-08-28</span>
  </div>
  <div class="header-right">
    <div class="sync-indicator" id="sync-dot" title="연결 상태"></div>
    <div class="header-time" id="clock">--:--:--</div>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('record', this)">📦 입출고</button>
  <button onclick="switchTab('stock', this)">📊 재고현황</button>
  <button onclick="switchTab('settings', this)">⚙️ 설정</button>
</nav>

<!-- ══ 입출고 ══ -->
<div class="page active" id="page-record">
  <div class="section-label">입고 / 출고 선택</div>
  <div class="type-toggle">
    <button class="type-btn in active" onclick="setType('in')">▲ 입고</button>
    <button class="type-btn out" onclick="setType('out')">▼ 출고</button>
  </div>

  <div class="section-label">담당자</div>
  <div class="field">
    <label>OPERATOR</label>
    <select id="operator"><option value="">-- 선택 --</option></select>
  </div>

  <div class="section-label">카테고리 & 모델</div>
  <div class="field">
    <label>CATEGORY</label>
    <select id="category" onchange="resetSerial(); updateModels()">
      <option value="">-- 선택 --</option>
      <option value="MCU">MCU</option>
      <option value="PC">PC</option>
      <option value="SMPS">SMPS</option>
      <option value="PCB">PCB & 전자부품</option>
      <option value="HARNESS">케이블</option>
    </select>
  </div>
  <div class="model-row">
    <div class="field">
      <label>MODEL</label>
      <select id="model" onchange="resetSerial(); updateCurrentStock();"><option value="">-- 카테고리 먼저 선택 --</option></select>
    </div>
    <button class="scan-btn" onclick="startScan()" title="QR/바코드 스캔">📷</button>
  </div>
  <div id="serial-row" style="display:none;margin-bottom:10px">
    <div class="field">
      <label>SERIAL (QR)</label>
      <div id="serial-display" style="padding:6px 14px 12px;font-family:var(--mono);font-size:13px;color:var(--accent2);display:flex;align-items:center;gap:8px">
        <span id="serial-value"></span>
        <button onclick="resetSerial()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0">✕ 초기화</button>
      </div>
    </div>
  </div>

  <div class="section-label">수량</div>
  <div class="qty-row">
    <div class="qty-card">
      <span class="qty-card-label">CURRENT STOCK</span>
      <div class="current-num" id="current-stock">—</div>
    </div>
    <div class="qty-card">
      <span class="qty-card-label">입출고 수량</span>
      <div class="qty-controls">
        <button onclick="changeQty(-1)">−</button>
        <input type="number" id="qty-input" value="1" min="1" oninput="sanitizeQty(this)">
        <button onclick="changeQty(1)">＋</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label>MEMO (선택)</label>
    <input type="text" id="memo" placeholder="비고사항 입력" style="padding:8px 14px 12px">
  </div>

  <button class="submit-btn in-mode" id="submit-btn" onclick="submitRecord()">▲ 입고 기록</button>
</div>

<!-- ══ 재고현황 ══ -->
<div class="page" id="page-stock">
  <div class="chart-wrap">
    <div class="chart-title">STOCK OVERVIEW</div>
    <div class="chart-canvas-wrap">
      <canvas id="stock-chart"></canvas>
    </div>
  </div>

  <div style="display:flex;align-items:center;margin-bottom:12px">
    <div class="stock-filter" id="stock-filter" style="margin-bottom:0;flex:1">
      <button class="filter-chip active" onclick="filterStock('ALL', this)">전체</button>
      <button class="filter-chip" onclick="filterStock('MCU', this)">MCU</button>
      <button class="filter-chip" onclick="filterStock('PC', this)">PC</button>
      <button class="filter-chip" onclick="filterStock('SMPS', this)">SMPS</button>
      <button class="filter-chip" onclick="filterStock('PCB', this)">PCB</button>
      <button class="filter-chip" onclick="filterStock('HARNESS', this)">케이블</button>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ 새로고침</button>
  </div>
  <div class="last-sync" id="last-sync-text"></div>
  <div id="stock-list"></div>
</div>

<!-- ══ 설정 ══ -->
<div class="page" id="page-settings">
  <div class="section-label">담당자 관리</div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>담당자 목록 <small style="display:inline;font-family:var(--mono);color:var(--muted)">(쉼표로 구분)</small></label>
    <input type="text" id="operators-input" placeholder="홍길동, 김철수, 이영희" style="width:100%;text-align:left">
  </div>

  <div class="section-label">모델 관리</div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>MCU 모델</label>
    <input type="text" id="mcu-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>PC 모델</label>
    <input type="text" id="pc-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>SMPS 모델</label>
    <input type="text" id="smps-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>PCB & 전자부품</label>
    <input type="text" id="pcb-models" style="width:100%;text-align:left">
  </div>
  <div class="settings-row" style="flex-direction:column;align-items:flex-start;gap:8px">
    <label>케이블</label>
    <input type="text" id="harness-models" style="width:100%;text-align:left">
  </div>

  <div class="section-label">최소 재고 설정</div>
  <div id="minstock-container">
    <p class="minstock-empty">모델을 먼저 등록하고 설정을 저장하면 입력 필드가 나타납니다.</p>
  </div>

  <button class="save-btn" onclick="saveSettings()">💾 설정 저장 (Sheets에 동기화)</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
